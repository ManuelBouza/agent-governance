name: T062 v15 Stage 5 validation v2

on:
  push:
    branches:
      - chore/t062-v15-harness-stage5-validation

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'uv==0.11.32'
      - run: uv sync --locked
      - name: Configure immutable Freeze F formatter exclusion
        run: >-
          python -c "from pathlib import Path; p=Path('pyproject.toml'); s=p.read_text(encoding='utf-8'); n='extend-exclude = [\n    \"**/*.md\",\n    \".venv\",\n]'; r='extend-exclude = [\n    \"**/*.md\",\n    \".venv\",\n    \"evals/skill_activation_topology/verify_v15_holdout_integrity.py\",\n]'; assert n in s; p.write_text(s.replace(n,r),encoding='utf-8',newline='\n')"
      - name: Format non-frozen mechanics
        run: |
          uv run --locked ruff format .
          git diff --check
      - name: Candidate guard
        run: uv run --locked python evals/skill_activation_topology/verify_v15_candidate_integrity.py
      - name: Holdout guard
        run: uv run --locked python evals/skill_activation_topology/verify_v15_holdout_integrity.py
      - name: Harness validate
        run: uv run --locked python evals/skill_activation_topology/harness.py validate
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      - name: Code health
        run: uv run --locked python tools/code_health.py check --root .
      - name: Symbol map
        run: uv run --locked python tools/code_health.py map --root .
      - name: Characterization
        run: >-
          uv run --locked python -m pytest
          tests/test_skill_activation_topology_harness.py
          tests/test_skill_activation_topology_v15.py
          tests/test_skill_activation_topology_v15_scheduler.py
          tests/test_t050_harness_cli_characterization.py
      - name: Full pytest
        run: uv run --locked python -m pytest
      - name: Provider boundary
        if: always()
        run: echo provider_model_calls=0
      - name: Stage validated scientific tree
        if: always()
        run: |
          root=/tmp/t062-v15-final-tree
          mkdir -p "$root"
          for path in \
            pyproject.toml \
            evals/skill_activation_topology/_harness/models.py \
            evals/skill_activation_topology/_harness/frozen_inputs.py \
            evals/skill_activation_topology/_harness/scheduling.py \
            evals/skill_activation_topology/_harness/aggregation.py \
            evals/skill_activation_topology/_harness/scoring.py \
            evals/skill_activation_topology/_harness/run_support.py \
            evals/skill_activation_topology/_harness/runner.py \
            evals/skill_activation_topology/_harness/scheduler_simulation.py \
            evals/skill_activation_topology/_harness/provenance.py \
            evals/skill_activation_topology/_harness/evidence.py \
            evals/skill_activation_topology/_harness/cli.py \
            evals/skill_activation_topology/harness.py \
            evals/skill_activation_topology/verify_v15_candidate_integrity.py \
            tests/test_harness_foundation.py \
            tests/test_skill_activation_topology_harness.py \
            tests/test_skill_activation_topology_v15.py \
            tests/test_skill_activation_topology_v15_scheduler.py \
            tests/test_t050_harness_cli_characterization.py
          do
            mkdir -p "$root/$(dirname "$path")"
            cp "$path" "$root/$path"
          done
      - name: Upload validated scientific tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t062-v15-final-tree
          path: /tmp/t062-v15-final-tree
          if-no-files-found: error
          retention-days: 1
