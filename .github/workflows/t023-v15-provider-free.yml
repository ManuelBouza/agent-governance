name: T023 v15 provider-free verification

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  holdout-integrity:
    if: github.head_ref == 'test/t023-skill-activation-topology-evals-v15'
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact PR head with full history
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$HEAD_SHA"
          git cat-file -e 3e5bec392d0b8e5804c4efaad74b795b08dc9779^{commit}
          git cat-file -e d0ebe46a68c02c66dcfbb21c3dfaee43fb15c27f^{commit}
          git cat-file -e aea43441a424fe18003176cb05b5594b8b561a68^{commit}
          python evals/skill_activation_topology/verify_v15_holdout_integrity.py
